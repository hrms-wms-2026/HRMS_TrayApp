name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Must match global.json (rollForward: disable requires exact SDK).
          # "10.0.x" alone can leave the runner on an older preinstalled 10.0.100
          # which then fails every subsequent `dotnet` command.
          global-json-file: global.json
          dotnet-version: "10.0.300"

      - name: Verify SDK
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Build Shared
        run: dotnet build ONEVO.Agent.Shared/ONEVO.Agent.Shared.csproj --configuration Release

      - name: Build Service
        run: dotnet build ONEVO.Agent.Service/ONEVO.Agent.Service.csproj --configuration Release

      - name: Build TrayApp
        run: dotnet build ONEVO.Agent.TrayApp/ONEVO.Agent.TrayApp.csproj --configuration Release

      # Proves the isolation guard below can fail: a write planted under a temp folder must be reported.
      - name: Test isolation guard - self-check
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "isolation-self-check"
          New-Item -ItemType Directory -Force $root | Out-Null
          ./scripts/check-test-isolation.ps1 -Snapshot "$root.txt" -Roots $root
          Set-Content (Join-Path $root "planted.txt") "planted"
          ./scripts/check-test-isolation.ps1 -Compare "$root.txt" -Roots $root -Plain
          if ($LASTEXITCODE -ne 1) { throw "check-test-isolation.ps1 missed a planted write" }
          $global:LASTEXITCODE = 0

      # Tests must never touch the real %ProgramData%\ONEVO or %LOCALAPPDATA%\ONEVO (UAT-20).
      - name: Test isolation guard - snapshot
        shell: pwsh
        run: ./scripts/check-test-isolation.ps1 -Snapshot "$env:RUNNER_TEMP/agent-data-before.txt"

      # Each project writes its cobertura report under coverage/<TestProject> for the gate below.
      - name: Test - Shared
        run: dotnet test tests/ONEVO.Agent.Shared.Tests/ONEVO.Agent.Shared.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage/ONEVO.Agent.Shared.Tests

      - name: Test - Service
        run: dotnet test tests/ONEVO.Agent.Service.Tests/ONEVO.Agent.Service.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage/ONEVO.Agent.Service.Tests

      - name: Test - TrayApp
        run: dotnet test tests/ONEVO.Agent.TrayApp.Tests/ONEVO.Agent.TrayApp.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage/ONEVO.Agent.TrayApp.Tests

      - name: Test isolation guard - compare
        if: success() || failure()
        shell: pwsh
        run: ./scripts/check-test-isolation.ps1 -Compare "$env:RUNNER_TEMP/agent-data-before.txt"

      # Floors are in coverage-thresholds.json (AUD-025).
      - name: Coverage gate
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -ResultsRoot coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
