name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Must match global.json (rollForward: disable requires exact SDK).
          # "10.0.x" alone can leave the runner on an older preinstalled 10.0.100
          # which then fails every subsequent `dotnet` command.
          global-json-file: global.json
          dotnet-version: "10.0.300"

      - name: Verify SDK
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Build Shared
        run: dotnet build ONEVO.Agent.Shared/ONEVO.Agent.Shared.csproj --configuration Release

      - name: Build Service
        run: dotnet build ONEVO.Agent.Service/ONEVO.Agent.Service.csproj --configuration Release

      - name: Build TrayApp
        run: dotnet build ONEVO.Agent.TrayApp/ONEVO.Agent.TrayApp.csproj --configuration Release

      - name: Test - Shared
        run: dotnet test tests/ONEVO.Agent.Shared.Tests/ONEVO.Agent.Shared.Tests.csproj --configuration Release

      - name: Test - Service
        run: dotnet test tests/ONEVO.Agent.Service.Tests/ONEVO.Agent.Service.Tests.csproj --configuration Release

      - name: Test - TrayApp
        run: dotnet test tests/ONEVO.Agent.TrayApp.Tests/ONEVO.Agent.TrayApp.Tests.csproj --configuration Release
